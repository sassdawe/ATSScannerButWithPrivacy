name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            ext: .exe
          - rid: osx-arm64
            os: macos-latest
            ext: ''
          - rid: osx-x64
            os: macos-latest
            ext: ''
          - rid: linux-x64
            os: ubuntu-latest
            ext: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Derive version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish
        run: >
          dotnet publish src/AtsScanner.Cli -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:VersionPrefix=${{ env.VERSION }}
          -o ./dist/${{ matrix.rid }}

      - name: Smoke test executable
        shell: bash
        run: |
          ./dist/${{ matrix.rid }}/ats-scanner${{ matrix.ext }} --help

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd dist/${{ matrix.rid }}
          zip -r ../../ats-scanner-${{ matrix.rid }}.zip .

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Push-Location "dist/${{ matrix.rid }}"
          Compress-Archive -Path * -DestinationPath "../../ats-scanner-${{ matrix.rid }}.zip" -Force
          Pop-Location

      - uses: actions/upload-artifact@v4
        with:
          name: ats-scanner-${{ matrix.rid }}
          path: ats-scanner-${{ matrix.rid }}.zip

  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            tfm: net10.0-windows10.0.19041.0
            artifact: gui-win-x64
          - rid: maccatalyst-x64
            os: macos-latest
            tfm: net10.0-maccatalyst
            artifact: gui-osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install required MAUI workloads
        run: dotnet workload restore src/AtsScanner.Gui/AtsScanner.Gui.csproj

      - name: Publish (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          dotnet publish src/AtsScanner.Gui -f ${{ matrix.tfm }} -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -o ./dist/${{ matrix.artifact }}

      - name: Publish (MacCatalyst)
        if: matrix.os == 'macos-latest'
        run: >
          dotnet publish src/AtsScanner.Gui -f ${{ matrix.tfm }} -c Release -r ${{ matrix.rid }}
          --self-contained true
          -o ./dist/${{ matrix.artifact }}

      - name: Verify published output exists
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            test -f "dist/${{ matrix.artifact }}/AtsScanner.Gui.exe"
          else
            ls -d dist/${{ matrix.artifact }}/*.app >/dev/null 2>&1
          fi

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Push-Location "dist/${{ matrix.artifact }}"
          Compress-Archive -Path * -DestinationPath "../../ats-scanner-${{ matrix.artifact }}.zip" -Force
          Pop-Location

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          cd dist/${{ matrix.artifact }}
          zip -r ../../ats-scanner-${{ matrix.artifact }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ats-scanner-${{ matrix.artifact }}
          path: ats-scanner-${{ matrix.artifact }}.zip

  release:
    needs: [build, build-gui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          files: '**/*.zip'
          generate_release_notes: true
